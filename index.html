<style>
/* Layout idea: one working column of cards under a navy bar; forms left, printed label right on wide screens. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213a; --muted:#5b6780; --line:#d9dfea;
  --navy:#12326b; --blue:#1f6fd6; --green:#2a9d63; --on-navy:#ffffff;
  --warn:#b26a00; --warn-bg:#fff3d9; --crit:#b3261e; --crit-bg:#fde7e5; --ok-bg:#e2f4ea;
  --zin:#1f6fd6; --xp:#b26a00; --tr:#2a9d63; --mat:#7445c7;
  --display:"Barlow Semi Condensed","Be Vietnam Pro",Arial,sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1524; --surface:#172136; --ink:#e8edf7; --muted:#9aa7c0; --line:#2b3852;
    --navy:#0b1f47; --blue:#6aa6f5; --green:#56c48b; --on-navy:#ffffff;
    --warn:#f0b354; --warn-bg:#3a2c10; --crit:#f2867f; --crit-bg:#40191a; --ok-bg:#143524;
    --zin:#6aa6f5; --xp:#f0b354; --tr:#56c48b; --mat:#b79af0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1524; --surface:#172136; --ink:#e8edf7; --muted:#9aa7c0; --line:#2b3852;
  --navy:#0b1f47; --blue:#6aa6f5; --green:#56c48b; --on-navy:#ffffff;
  --warn:#f0b354; --warn-bg:#3a2c10; --crit:#f2867f; --crit-bg:#40191a; --ok-bg:#143524;
  --zin:#6aa6f5; --xp:#f0b354; --tr:#56c48b; --mat:#b79af0; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px;color:var(--muted)}
.top{background:var(--navy);color:var(--on-navy);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;border-bottom:3px solid var(--green)}
.brand{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.2px}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;opacity:.8;margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{color:var(--on-navy);text-decoration:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:14px;opacity:.85}
nav a[aria-current="page"]{background:var(--on-navy);color:#12326b;opacity:1}
nav a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-visible{outline:3px solid var(--green);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{max-width:1120px;margin:12px auto 0;padding:0 16px}
.note{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;font-size:14px}
.note.crit{background:var(--crit-bg);color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 150px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;border-left:5px solid var(--k)}
.seg button b{display:block;font-family:var(--display);font-size:17px}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
label.chk{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);align-self:end;padding:9px 0}
label.chk input{width:20px;height:20px;flex:none;padding:0}
input:disabled{opacity:.6}
.btn{font:inherit;font-weight:700;border-radius:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
:root[data-theme="dark"] .btn{color:#0e1524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0e1524}}
.btn.ghost,.btn.ghost:link{background:transparent;color:var(--blue)}
.btn.danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.lotprev{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.drop.over{border-color:var(--green)}
.drop img{max-width:100%;max-height:180px;border-radius:6px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--k,var(--muted));color:var(--k,var(--muted));white-space:nowrap}
.pill.solid{background:var(--ok-bg);border-color:var(--green);color:var(--green)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.crit{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.k-MAT{--k:var(--mat)} .k-ZIN{--k:var(--zin)} .k-XP{--k:var(--xp)} .k-TR{--k:var(--tr)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.zone{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.zone h3{color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.slot{font:inherit;font-size:11px;line-height:1.2;padding:5px 2px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;text-align:center;min-width:0}
.slot b{display:block;font-size:14px;color:var(--ink)}
.slot.has{background:var(--ok-bg);border-color:var(--green)}
.slot[aria-pressed="true"]{outline:3px solid var(--blue);background:var(--blue);border-color:var(--blue);color:var(--bg)}
.slot[aria-pressed="true"] b{color:var(--bg)}
.thumb{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.iqcimg{width:240px;max-width:100%;border-radius:6px;border:1px solid var(--line)}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--k,var(--muted));border-radius:10px;padding:12px;min-width:0}
.tile span{font-size:13px;color:var(--muted);display:block}
.tile b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.first td{background:var(--ok-bg)}
.baghead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.lot{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.remain{text-align:right}
.remain span{display:block;font-size:12px;color:var(--muted)}
.remain b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
dl.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 16px;margin:0}
dl.facts div{min-width:0}
dl.facts dt{font-size:12px;color:var(--muted)}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
ul.tree{list-style:none;margin:0;padding-left:18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
ul.tree li{overflow-wrap:anywhere}
.labelimg{width:100%;max-width:640px;border:1px solid var(--line);border-radius:4px;background:#fff;display:block}
.labels{display:flex;flex-direction:column;gap:14px}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);padding:8px 0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#scanov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.scanbox{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:520px;width:100%;color:#fff}
.scanbox video{width:100%;max-height:65vh;border-radius:8px;background:#000}
.scanbox p{margin:0;font-weight:600;text-align:center}
#printbox{display:none}
@media print{body>*:not(#printbox){display:none!important}#printbox{display:block}.plabel{display:block;width:100mm;height:50mm;break-after:page;page-break-after:always}@page{size:100mm 50mm;margin:0}}
#toast{z-index:60;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

(function(){

var KIND={

var ZONES=["A","B","C","D"],TIERS=2,SLOTS=6,stockLoc="",recvMode="lot";
try{var svm=localStorage.getItem("n2p-recv-mode");if(svm==="each"||svm==="lot"||svm==="pallet")recvMode=svm;}catch(e){}
function locText(b){return b&&b.loc?(b.locSide?"Cạnh kệ ":"")+b.loc:"";}

var locSel=[],locSelFor="";

function shelfHtml(act,pressed){
  var c=locCounts();
  return '<div class="shelf">'+ZONES.map(function(z){
    var hz='<div class="zone"><h3>Khu '+z+'</h3>';
    for(var t=TIERS;t>=1;t--){hz+='<div class="slots">';for(var k=1;k<=SLOTS;k++){var L=z+t+"-"+k,n=c.cnt[L]||0,sd=c.side[L]||0;hz+='<button type="button" class="slot'+(n?" has":"")+'" data-act="'+act+'" data-loc="'+L+'" aria-pressed="'+pressed(L)+'">'+L+'<b>'+(n?(n-sd)+(sd?"+"+sd:""):"·")+'</b></button>';}hz+='</div>';}
    return hz+'</div>';
  }).join("")+'</div>';
}
/* Chọn ô kệ bằng cách bấm; bấm nhiều ô được. */
function locFields(b){
  return '<div class="full" style="display:flex;flex-direction:column;gap:8px"><span class="hint"><b>Vị trí giá kệ</b>: bấm vào các ô để chọn, bấm lại để bỏ. Số trong ô là số tem đang nằm ở đó.</span>'+
    shelfHtml("lpick",function(L){return locSel.indexOf(L)>=0;})+
    '<div class="row"><label class="chk" for="loc-side" style="align-self:center"><input type="checkbox" id="loc-side" name="lside"'+(b&&b.locSide?" checked":"")+'> Hết chỗ, để cạnh các kệ này</label><button type="button" class="btn small ghost" data-act="lclear">Bỏ chọn hết</button></div>'+

/* Chia các ô đã chọn cho N tem: đủ ô thì mỗi tem một ô; ít ô hơn thì nhiều tem chung một ô; nhiều ô hơn thì một tem nhận nhiều ô. */
function assignLocs(S,N){
  var out=[],i;
  if(!S.length){for(i=0;i<N;i++)out.push("");return out;}
  if(S.length<=N){for(i=0;i<N;i++)out.push(S[Math.floor(i*S.length/N)]);return out;}
  for(i=0;i<N;i++)out.push([]);
  S.forEach(function(L,j){out[Math.floor(j*N/S.length)].push(L);});
  return out.map(function(a){return a.join(", ");});
}
function updLocSum(f){
  var el=$("#loc-sum");if(!el)return;
  if(!locSel.length){el.textContent="Chưa chọn ô nào (chưa xếp kệ).";return;}
  var t="Đã chọn "+locSel.length+" ô: "+locSel.join(", ")+".";
  if(f&&f.total){
    var r=recvItems(f),N=r.items?r.items.length:0,word=r.mode==="pallet"?"Pallet":r.mode==="each"?(f.id==="f-mat"?"Kiện":"Bao"):"";
    if(N>1){var a=assignLocs(locSel,N);t+=" "+a.slice(0,6).map(function(x,i){return word+" "+(i+1)+" → "+x;}).join("; ")+(N>6?"; …":"")+".";}
    else if(N===1&&locSel.length>1)t+=" Cả lô nằm trên các ô này.";
  }
  el.textContent=t;
}
function bagsText(b,kg){if(!b.perBag||!(b.perBag>0)||kg==null)return "";var n=kg/b.perBag;return " ≈ "+(Math.round(n*10)/10).toLocaleString("vi-VN")+" "+(b.kind==="MAT"?"kiện":"bao");}

try{iqcPin=localStorage.getItem("n2p-iqc-pin")||"";}catch(e){}

var EV={MOVE:"Chuyển vị trí",IQC_OK:"IQC đạt, nhập kho",IQC_NG:"IQC không đạt",IN:"Nhập kho",CREATE:"Tạo tem",WEIGH:"Cân thực tế",OUT:"Xuất",ADJUST:"Điều chỉnh tồn",VOID:"Hủy tem"};

      w1:"FIFO: use the oldest lot first.",w2:"Scan the QR code for IQC, weighing and issues.",foot:"AN MY N2P VINA - Material and resin stock control"},
  ko:{mat:"자재명",cat:"구분",qty:"수량",lot:"Lot No",recv:"입고일",grade:"그레이드",color:"색상",base:"원 Lot",wt:"중량",ratio:"혼합 비율",part:"품번 - 호기",sup:"공급업체",src:"출처",date:"일자",bag:"포대 ID",
      w1:"선입선출: 오래된 Lot부터 사용.",w2:"QR 스캔: IQC, 실중량 입력, 출고 처리.",foot:"AN MY N2P VINA - 자재·원료 재고 관리"}
};

function clone(o){return JSON.parse(JSON.stringify(o));}
function num(v){var n=parseFloat(String(v==null?"":v).trim().replace(",","."));return isFinite(n)?n:NaN;}
function r2(n){return Math.round(n*100)/100;}
function fmtKg(n,u){return n==null?"—":r2(n).toLocaleString("vi-VN",{maximumFractionDigits:2})+" "+(u||"kg");}
function unitOf(b){return (b&&b.unit)||"kg";}
function isIqc(b){return b.status==="IQC_PENDING"||b.status==="IQC_NG";}
function totalText(lines){var t={},o=[];lines.forEach(function(l){var u=l.unit||"kg";if(!(u in t)){t[u]=0;o.push(u);}t[u]+=l.kg;});return o.map(function(u){return fmtKg(t[u],u);}).join(" + ");}

function webScan(text,onText){
  var old=$("#scanov");if(old)old.remove();
  var ov=document.createElement("div");ov.id="scanov";
  ov.innerHTML='<div class="scanbox"><p>'+esc(text)+'</p><video playsinline muted></video><button type="button" class="btn" id="scan-close">Đóng</button></div>';
  document.body.appendChild(ov);
  var v=$("video",ov),c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true}),stream=null,raf=0,last="",lastT=0,dead=false;
  function stop(){dead=true;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop();});ov.remove();}
  $("#scan-close",ov).addEventListener("click",stop);
  function tick(){
    if(dead)return;
    if(v.readyState>=2&&v.videoWidth){
      var k=Math.min(1,800/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
      x.drawImage(v,0,0,c.width,c.height);
      var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(r&&r.data){var now=Date.now();if(r.data!==last||now-lastT>3000){last=r.data;lastT=now;if(onText(r.data)===true){stop();return;}}}
    }
    raf=requestAnimationFrame(tick);
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(st){if(dead){st.getTracks().forEach(function(t){t.stop();});return;}stream=st;v.srcObject=st;v.play();tick();})
    .catch(function(){stop();toast("Không mở được camera. Cho phép quyền camera, hoặc dùng ảnh mã QR.");});
}
function scanQR(text,onText){

  if(camScan())webScan(text,onText);else toast("Thiết bị này không mở được trình quét. Dùng ảnh mã QR.");
}

function F(w,s,it){return (it?"italic ":"")+w+" "+s+'px "Be Vietnam Pro","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif';}
function fitText(x,text,w,size,maxW,it){
  var s=size;x.font=F(w,s,it);
  while(s>14&&x.measureText(text).width>maxW){s-=2;x.font=F(w,s,it);}
  return s;

function drawQR(x,text,px,py,size,id){
  var ok=false;
  try{
    if(typeof qrcode==="function"){
      var q=qrcode(0,"M");q.addData(text);q.make();
      var n=q.getModuleCount(),cell=size/n;
      x.fillStyle="#000";
      for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(px+Math.floor(c*cell),py+Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell));
      ok=true;
    }
  }catch(e){}
  if(!ok){x.strokeStyle="#000";x.lineWidth=3;x.strokeRect(px,py,size,size);x.fillStyle="#000";x.font=F(700,34);x.textAlign="center";x.fillText("Mã bao",px+size/2,py+size/2-10);x.fillText(ID(id),px+size/2,py+size/2+36);x.textAlign="left";}
}
function labelRows(b,T){

  var wt=b.actualKg!=null?fmtKg(b.actualKg,u)+pk:b.plannedKg!=null&&inc?fmtKg(b.plannedKg,u)+pk:(b.plannedKg!=null?(inc?fmtKg(b.plannedKg,u):"Dự kiến "+fmtKg(b.plannedKg,u)+"   Thực tế: ________ "+u):"________ "+u);
  if(b.kind==="MAT"){
    rows=[["Tên vật tư",T.mat,b.grade||"—"],["Loại",T.cat,b.cat||"—"],["Lot No",T.lot,b.lotNo||"—"],["Số lượng",T.qty,wt]];
    if(b.partCode)rows.push(["Mã hàng",T.part.split(" ")[0],b.partCode]);
  }else{
    rows=[["Loại nhựa",T.grade,b.grade||"—"],["Màu",T.color,b.color||"—"],["Lot gốc",T.base,b.baseLot||"—"],["Khối lượng",T.wt,wt]];
    if(b.kind==="TR"&&b.ratio)rows.push(["Tỷ lệ trộn",T.ratio,"Zin "+b.ratio.zinPct+"% : Xay "+b.ratio.xpPct+"%"]);
    if(b.kind==="XP"&&(b.partCode||b.machine))rows.push(["Mã hàng - Máy",T.part,[b.partCode,b.machine].filter(Boolean).join(" - ")]);

  return rows;
}
function drawLabel(x,b,ox,oy,sc){
  var W=1600,H=800,T=L2[lang]||L2.en,k=KIND[kindOf(b.kind)];
  x.save();x.translate(ox,oy);x.scale(sc,sc);
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.strokeStyle="#000";x.lineWidth=4;x.strokeRect(3,3,W-6,H-6);
  x.fillStyle="#000";x.textBaseline="alphabetic";x.textAlign="left";
  var qs=300,qx=W-qs-40,qy=36;
  drawQR(x,qrText(b.id),qx,qy,qs,b.id);
  x.fillStyle="#000";x.font=F(700,32);x.textAlign="center";x.fillText(ID(b.id),qx+qs/2,qy+qs+38);x.textAlign="left";
  fitText(x,b.lotNo,800,118,qx-70);x.fillText(b.lotNo,36,138);
  fitText(x,b.kind==="MAT"?b.grade:k.vi,700,56,qx-70);x.fillText(b.kind==="MAT"?b.grade:k.vi,36,212);
  x.font=F(700,56);x.fillText(k[lang]||k.en,36,278);
  var rows=labelRows(b,T),y=350,step=46;
  rows.forEach(function(r){
    x.font=F(400,31);x.fillText(r[0]+"/ ",36,y);var w=x.measureText(r[0]+"/ ").width;
    x.font=F(400,31,true);x.fillText(r[1],36+w,y);
    x.font=F(400,31);x.fillText(":",560,y);
    var maxW=(y<420?qx-600:W-620);
    fitText(x,String(r[2]),600,31,maxW);x.fillText(String(r[2]),584,y);
    y+=step;
  });
  x.font=F(400,26);x.fillText("- Dùng lot cũ trước (FIFO)/ ",36,700);var w1=x.measureText("- Dùng lot cũ trước (FIFO)/ ").width;
  x.font=F(400,26,true);x.fillText(T.w1,36+w1,700);
  x.font=F(400,26);x.fillText("- Quét mã QR để IQC, nhập số lượng và xuất kho/ ",36,734);var w2=x.measureText("- Quét mã QR để IQC, nhập số lượng và xuất kho/ ").width;
  x.font=F(400,26,true);fitText(x,T.w2,400,26,W-72-w2,true);x.fillText(T.w2,36+w2,734);
  x.font=F(700,25);x.textAlign="center";x.fillText(T.foot,W/2,776);
  x.restore();
}

function loadImg(file){
  return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res(im);};im.onerror=function(){rej(new Error("img"));};im.src=u;});
}
async function decodeQR(file){
  if(typeof jsQR!=="function")return null;
  var im=await loadImg(file),sizes=[1500,1000,640];
  for(var i=0;i<sizes.length;i++){
    var s=Math.min(1,sizes[i]/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
    var d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height);
    if(r&&r.data)return r.data;
  }
  return null;
}
async function shrink(file,max){
  var im=await loadImg(file),s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(function(b){res(b||file);},"image/jpeg",0.85);});
}
var OCR_PROMPT='Ảnh là tem dán trên bao nhựa nguyên liệu (hạt nhựa). Đọc tem và trả về DUY NHẤT một đối tượng JSON, không giải thích: {"grade":string|null,"color":string|null,"lotNo":string|null,"netKg":number|null,"supplier":string|null}. grade = tên thương mại và mã grade ghép lại, ví dụ "LUPOX GP2306F". color = mã màu. lotNo = đúng từng ký tự của LOT NO. netKg = khối lượng tịnh tính bằng kg (chỉ số). supplier = tên hãng nếu có in. Trường nào không thấy thì null.';
var OCR_MAT='Ảnh là tem dán trên kiện vật tư, linh kiện sản xuất (ví dụ lug, plate, primer, keo, packing). Đọc tem và trả về DUY NHẤT một đối tượng JSON, không giải thích: {"name":string|null,"partCode":string|null,"lotNo":string|null,"qty":number|null,"unit":string|null,"supplier":string|null}. name = tên vật tư hoặc tên linh kiện in trên tem. partCode = mã hàng, mã linh kiện (part no, item code) nếu có. lotNo = đúng từng ký tự của số lot (LOT NO, Lot, Batch). qty = số lượng trong kiện (chỉ số). unit = đơn vị của số lượng, một trong: pcs, kg, l, can, roll, box. supplier = tên nhà cung cấp hoặc hãng nếu có in. Trường nào không thấy thì null.';
async function askOcr(prompt,file,max){

  var blob=await shrink(file,max),b64=await blobB64(blob);
  var r=await api("ocr",{prompt:prompt,b64:b64,mime:blob.type||"image/jpeg"});

async function runOCR(file){
  var st=$("#ocr-status");if(!st)return;
  if(!ready&&!memMode){st.textContent="App đang tải dữ liệu. Chọn lại ảnh sau vài giây.";return;}
  if(memMode||!hasOcr){st.textContent="Chưa bật đọc chữ từ ảnh. Nhập tay theo ảnh bên trên.";return;}
  st.textContent="Đang đọc tem từ ảnh…";
  try{
    var isMat=mode==="MAT",o=await askOcr(isMat?OCR_MAT:OCR_PROMPT,file,1600);
    var put=function(sel,v){var el=$(sel);if(el&&v!=null&&String(v).trim()!=="")el.value=String(v).trim().slice(0,80);};
    if(isMat){
      put("#mat-name",o.name);put("#mat-lot",o.lotNo);put("#mat-part",o.partCode);put("#mat-supplier",o.supplier);
      if(typeof o.qty==="number"&&o.qty>0)put("#mat-kg",o.qty);
      var un={pcs:"pcs",ea:"pcs",pc:"pcs",kg:"kg",l:"lít","lít":"lít",lit:"lít",can:"can",roll:"cuộn","cuộn":"cuộn",box:"hộp","hộp":"hộp"}[String(o.unit||"").toLowerCase()],us=$("#mat-unit");
      if(un&&us)us.value=un;
      updSplit($("#f-mat"));st.textContent="Đã điền từ ảnh. Kiểm tra lại từng ô trước khi lưu.";return;
    }

/* ---------- actions ---------- */
var MAX_SPLIT=100;
function splitPlan(f){
  var total=num(f.total.value),per=num(f.kg.value);
  if(!(total>0)||!(per>0))return null;
  var n=Math.floor(total/per+1e-9),rem=r2(total-n*per);if(rem<0.005)rem=0;
  var qs=[];for(var i=0;i<n&&i<=MAX_SPLIT;i++)qs.push(r2(per));if(rem)qs.push(rem);
  return {n:n,per:r2(per),rem:rem,count:n+(rem?1:0),total:r2(total),qs:qs};
}
function recvItems(f){
  var w=f.id==="f-mat"?"kiện":"bao",mode=f.rmode.value,per=num(f.kg.value),plan=splitPlan(f),q=Math.round(num(f.qty.value)||0);
  if(!(per>0))return {err:"Số lượng mỗi "+w+" phải lớn hơn 0."};
  if(!plan&&q<1)return {err:"Số "+w+" phải từ 1 trở lên."};
  var total=plan?plan.total:r2(per*q),count=plan?plan.count:q,items=[],base={total:total,count:count,per:r2(per),word:w,mode:mode,plan:plan};
  if(mode==="lot")items=[{kg:total,n:count}];
  else if(mode==="pallet"){
    var P=Math.round(num(f.pp.value)||0);if(P<1){base.err="Nhập số "+w+" mỗi pallet.";return base;}
    var pk=r2(P*per),full=Math.floor(total/pk+1e-9),rem=r2(total-full*pk);if(rem<0.005)rem=0;
    for(var i=0;i<full&&i<=MAX_SPLIT;i++)items.push({kg:pk,n:P});
    if(rem)items.push({kg:rem,n:Math.ceil(rem/per-1e-9)});
  }else if(plan)plan.qs.forEach(function(k){items.push({kg:k,n:1});});
  else for(var j=0;j<q&&j<=MAX_SPLIT;j++)items.push({kg:r2(per),n:1});
  base.items=items;return base;
}
function updSplit(f){
  if(!f||!f.total)return;
  var h=$("[data-split]",f),u=f.unit?f.unit.value:"kg",mode=f.rmode.value,plan=splitPlan(f),w=f.id==="f-mat"?"kiện":"bao",t;
  $$("[data-pal]",f).forEach(function(el){el.hidden=mode!=="pallet";});
  if(plan){f.qty.value=plan.count;f.qty.disabled=true;}else f.qty.disabled=false;
  var r=recvItems(f);
  if(r.total==null)t=num(f.total.value)>0?"Nhập thêm số lượng mỗi "+w+" để app tính số "+w+".":"Nhập tổng nhận về và số lượng mỗi "+w+", hoặc bỏ trống tổng rồi tự nhập số "+w+".";
  else{
    t=plan?(plan.n?plan.n+" "+w+" × "+fmtKg(plan.per,u):"")+(plan.rem?(plan.n?" + ":"")+"1 "+w+" lẻ "+fmtKg(plan.rem,u):"")+" = "+fmtKg(plan.total,u)+". ":r.count+" "+w+" × "+fmtKg(r.per,u)+" = "+fmtKg(r.total,u)+". ";
    if(!r.items)t+=r.err;
    else if(mode==="lot")t+="Một tem cho cả lô.";
    else if(mode==="pallet"){var N=r.items.length,a=r.items[0],z=r.items[N-1];t+=N+" pallet, mỗi pallet "+a.n+" "+w+" ("+fmtKg(a.kg,u)+")"+(N>1&&z.kg!==a.kg?", pallet cuối "+z.n+" "+w+" ("+fmtKg(z.kg,u)+")":"")+". Mỗi pallet một tem."+(N>MAX_SPLIT?" Quá "+MAX_SPLIT+" pallet một lần, hãy chia làm nhiều lần nhập.":"");}
    else t+=r.items.length>MAX_SPLIT?"Quá "+MAX_SPLIT+" "+w+" một lần: chọn một tem cho cả lô hoặc theo pallet, hoặc chia làm nhiều lần nhập.":"Mỗi "+w+" một tem, tổng "+r.items.length+" tem.";
  }
  if(h)h.textContent=t;
  updLocSum(f);
}
async function createIncoming(f,kind){
  var mat=kind==="MAT",name=f.grade.value.trim(),lot=f.lot.value.trim(),kg=num(f.kg.value),unit=mat?f.unit.value:"kg",w=mat?"kiện":"bao";
  if(!name||!lot){toast(mat?"Cần nhập Tên vật tư và Lot No.":"Cần nhập Grade và Lot No.");return;}
  var r=recvItems(f);
  if(!r.items){toast(r.err);return;}
  var items=r.items,N=items.length,mode=r.mode,L=readLoc(f),locs=assignLocs(L.list,N);
  if(N>MAX_SPLIT){toast("Mỗi lần tạo tối đa "+MAX_SPLIT+" tem. Hãy chia làm nhiều lần nhập.");return;}
  var rd=f.istoday.checked?"":f.rdate.value,back=null;
  if(!f.istoday.checked){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(rd)){toast("Chọn ngày nhận hàng, hoặc tích Nhận hôm nay.");return;}
    if(rd>today()){toast("Ngày nhận không được sau hôm nay.");return;}
    if(rd<today()){var nw=new Date();back=new Date(+rd.slice(0,4),+rd.slice(5,7)-1,+rd.slice(8,10),nw.getHours(),nw.getMinutes(),nw.getSeconds());}
  }
  var ids=[],batch="r"+Date.now().toString(36),t0=Date.now(),each=mode==="each",iw=mode==="pallet"?"pallet":w;
  var vals={color:mat?"":f.color.value.trim(),cat:mat?f.cat.value:"",part:mat?f.part.value.trim():"",sup:f.supplier.value.trim(),note:f.note.value.trim()};
  for(var i=0;i<N;i++){
    if(N>1)toast("Đang tạo tem "+(i+1)+"/"+N+"…");
    var loc=locs[i];
    var b=newBag({kind:kind,lotNo:lot,baseLot:lot,grade:name,color:vals.color,cat:vals.cat,partCode:vals.part,unit:unit,batch:N>1?batch:"",loc:loc,locSide:loc?L.side:false,
      bagCount:each?1:items[i].n,perBag:each?null:r.per,pal:mode==="pallet"?(i+1)+"/"+N:"",
      supplier:vals.sup,plannedKg:items[i].kg,actualKg:null,remainKg:0,status:"IQC_PENDING",note:vals.note});
    b.createdAt=new Date((back?back.getTime():t0)+i*1000).toISOString();
    b.events.push(ev("CREATE",items[i].kg,"Nhận hàng, chờ IQC"+(N>1?" ("+iw+" "+(i+1)+"/"+N+")":"")+(!each&&items[i].n>1?" · "+items[i].n+" "+w+" × "+fmtKg(r.per,unit):"")+(loc?" · vị trí "+(L.side?"cạnh kệ ":"")+loc:"")+(back?" · ngày nhận "+rd.split("-").reverse().join("/")+", ghi sổ sau":"")));
    try{await save(b);}catch(e){bags.delete(b.id);if(ids.length)done(ids,"Mới tạo được "+ids.length+"/"+N+" tem thì lỗi mạng. Kiểm tra rồi nhập tiếp phần còn lại.");return;}
    ids.push(b.id);
  }
  done(ids,"Đã tạo "+N+" tem. Hàng chờ IQC kiểm trước khi vào kho.");
}
async function createXP(f){
  var sid=f.src.value,src=sid?bags.get(sid):null,base,grade,color,sources=[];
  if(src){base=src.baseLot;grade=src.grade;color=src.color;sources=[{bagId:src.id,lotNo:src.lotNo,kind:src.kind,kg:null}];}
  else{base=stripSfx(f.mlot.value);grade=f.mgrade.value.trim();color=f.mcolor.value.trim();if(!base||!grade){toast("Chọn bao nguồn, hoặc nhập Lot gốc và Grade.");return;}sources=[{bagId:null,lotNo:f.mlot.value.trim(),kind:/-TR$/i.test(f.mlot.value.trim())?"TR":"ZIN",kg:null}];}
  var pk=f.kg.value.trim()===""?null:num(f.kg.value);
  if(pk!=null&&!(pk>0)){toast("Kg dự kiến phải lớn hơn 0, hoặc để trống.");return;}
  var b=newBag({kind:"XP",lotNo:base+"-XP",baseLot:base,grade:grade,color:color,partCode:f.part.value.trim(),machine:f.machine.value.trim(),plannedKg:pk==null?null:r2(pk),sources:sources,note:f.note.value.trim()});
  b.events.push(ev("CREATE",pk,"Tạo tem nhựa xay từ "+sources[0].lotNo));
  await save(b);done([b.id],"Đã tạo tem nhựa xay. Xay xong thì quét mã để nhập kg thực tế.");
}
async function createTR(f){
  var z=bags.get(f.zin.value),x=bags.get(f.xp.value),kz=num(f.kgz.value),kx=num(f.kgx.value);
  if(!z||!x){toast("Chọn một bao nhựa zin và một bao nhựa xay còn tồn.");return;}
  if(!(kz>0)||!(kx>0)){toast("Nhập số kg lấy từ mỗi bao.");return;}
  if(kz>z.remainKg+0.001){toast("Bao zin "+ID(z.id)+" chỉ còn "+fmtKg(z.remainKg)+".");return;}
  if(kx>x.remainKg+0.001){toast("Bao xay "+ID(x.id)+" chỉ còn "+fmtKg(x.remainKg)+".");return;}
  var base=f.base&&f.base.value?f.base.value:x.baseLot,tot=kz+kx,zp=Math.round(kz/tot*100);
  var b=newBag({kind:"TR",lotNo:base+"-TR",baseLot:base,grade:z.grade,color:z.color,plannedKg:r2(tot),ratio:{zinPct:zp,xpPct:100-zp},
    sources:[{bagId:z.id,lotNo:z.lotNo,kind:"ZIN",kg:r2(kz)},{bagId:x.id,lotNo:x.lotNo,kind:"XP",kg:r2(kx)}],note:f.note.value.trim()});
  b.events.push(ev("CREATE",tot,"Trộn zin "+ID(z.id)+" + xay "+ID(x.id)));
  await save(b);
  await issue(z.id,kz,"Trộn → "+b.lotNo+" ("+ID(b.id)+")");
  await issue(x.id,kx,"Trộn → "+b.lotNo+" ("+ID(b.id)+")");
  done([b.id],"Đã tạo tem nhựa trộn và trừ tồn hai bao nguồn.");
}

function updHints(){
  if(view!=="tao-tem")return;
  if(mode==="XP"){
    var s=$("#xp-src");if(!s)return;var src=s.value?bags.get(s.value):null;
    $$("[data-manual]").forEach(function(el){el.hidden=!!src;});
    var base=src?src.baseLot:stripSfx($("#xp-mlot").value);
    $("#xp-prev").textContent=base?base+"-XP":"—";
  }else if(mode==="TR"){
    var zs=$("#tr-zin"),xs=$("#tr-xp");if(!zs)return;
    var z=bags.get(zs.value),x=bags.get(xs.value),bw=$("#tr-basewrap"),bs=$("#tr-base"),hint=[];
    if(z&&x){
      if(z.baseLot!==x.baseLot){
        var keep=bs.value;bs.innerHTML='<option value="'+esc(x.baseLot)+'">'+esc(x.baseLot)+' (lot của nhựa xay)</option><option value="'+esc(z.baseLot)+'">'+esc(z.baseLot)+' (lot của nhựa zin)</option>';
        if(keep===z.baseLot)bs.value=keep;bw.hidden=false;
      }else{bs.innerHTML='<option value="'+esc(x.baseLot)+'">'+esc(x.baseLot)+'</option>';bw.hidden=true;}
      $("#tr-prev").textContent=(bs.value||x.baseLot)+"-TR";
      var kz=num($("#tr-kgz").value),kx=num($("#tr-kgx").value);
      if(kz>0&&kx>0){var zp=Math.round(kz/(kz+kx)*100);hint.push("Tổng "+fmtKg(kz+kx)+" · Zin "+zp+"% : Xay "+(100-zp)+"%.");}
      if(String(z.grade).toUpperCase()!==String(x.grade).toUpperCase())hint.push("Cảnh báo: hai bao khác grade ("+z.grade+" và "+x.grade+").");
      if(zs.selectedIndex>0)hint.push("Bao zin đang chọn không phải bao cũ nhất.");
      if(xs.selectedIndex>0)hint.push("Bao xay đang chọn không phải bao cũ nhất.");
    }else $("#tr-prev").textContent="—";
    $("#tr-hint").textContent=hint.join(" ");
  }
}

function tree(b,depth,seen){
  if(!b.sources||!b.sources.length)return "";

    var sb=s.bagId?bags.get(s.bagId):null;
    var h=kindPill(s.kind)+' <b>'+esc(s.lotNo)+'</b>'+(s.bagId?' <a href="#tem-'+esc(s.bagId)+'">'+esc(ID(s.bagId))+'</a>':' (nhập tay, không có tem)')+(s.kg!=null?' · '+fmtKg(s.kg):'')+(sb&&sb.kind==="ZIN"&&sb.supplier?' · '+esc(sb.supplier):'');
    var sub=(sb&&depth<8&&!seen[sb.id])?tree(sb,depth+1,Object.assign({},seen,(function(){var o={};o[sb.id]=1;return o;})())):"";

  }).join("")+'</ul>';

async function unlockIqc(f){
  var b=bags.get(curId),pin=f.pin.value.trim();if(!b)return;

  try{await api("iqc",{id:b.id,result:"CHECK",iqcPin:pin});}
  catch(e){
    if(!e||e.code!=="server"){toast(e&&e.code?errMsg(e,"Không mở được."):"Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.");return;}
  }
  iqcPin=pin;try{localStorage.setItem("n2p-iqc-pin",pin);}catch(x){}
  render();
}

async function submitIqc(f){

    [b].concat(rest).forEach(function(x,i){
      var c=clone(x),q=i?x.plannedKg:qty;c.iqc={result:res,by:myId||"",at:new Date().toISOString(),note:note,photos:[]};

    bags.set(r.bag.id,r.bag);doneN=1;iqcPin=pin;try{localStorage.setItem("n2p-iqc-pin",pin);}catch(e){}

function route(){
  var h=(location.hash||"").replace(/^#/,""),m=/^tem-([0-9a-z]{6})$/i.exec(h);
  voidArm=false;
  if(m){var id=m[1].toLowerCase();if(curId!==id){bagLabel=false;iqcFiles=[];}view="tem";curId=id;}
  else if(/^px-([0-9a-z]{6})$/i.test(h)){view="px";curSlip=h.slice(3).toLowerCase();}
  else if(["tao-tem","iqc","quet","xuat-may","kho","lich-su"].indexOf(h)>=0)view=h;
  else view="tao-tem";
  render();window.scrollTo(0,0);
}
function onData(first){
  if(first){render();return;}
  if(view==="xuat-may"){renderSlipList();return;}
  var a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  if(view==="kho"||view==="lich-su"||view==="iqc"||((view==="tem"||view==="quet"||view==="px")&&!typing&&!$("#f-iqc")))render();
}

/* ---------- events ---------- */
var busy=false;
async function guard(fn){if(busy)return;busy=true;try{await fn();}catch(e){}finally{busy=false;}}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var act=t.dataset.act;
  if(act==="mode"){mode=t.dataset.mode;labelIds=[];render();}
  else if(act==="dl")guard(function(){return downloadLabels([t.dataset.id]);});
  else if(act==="dl-all")guard(function(){return downloadLabels(labelIds.slice());});
  else if(act==="print-all")guard(function(){return printLabels(labelIds.slice());});
  else if(act==="print-one")guard(function(){return printLabels([t.dataset.id]);});
  else if(act==="print-copies")guard(function(){return printLabels([t.dataset.id],+t.dataset.n||1);});
  else if(act==="lpick"){var li=locSel.indexOf(t.dataset.loc);if(li>=0)locSel.splice(li,1);else locSel.push(t.dataset.loc);t.setAttribute("aria-pressed",String(li<0));updLocSum(t.closest("form"));}
  else if(act==="lclear"){locSel=[];$$('[data-act="lpick"]').forEach(function(x){x.setAttribute("aria-pressed","false");});updLocSum(t.closest("form"));}
  else if(act==="sloc"){stockLoc=stockLoc===t.dataset.loc?"":t.dataset.loc;render();}
  else if(act==="reprint"){bagLabel=true;render();}
  else if(act==="skind"){stockKind=t.dataset.kind;render();}
  else if(act==="csv-stock")guard(function(){return exportCsv("stock");});
  else if(act==="csv-slip")guard(function(){return exportCsv("slip");});
  else if(act==="line-add"){slipLines.push({bagId:"",name:"",lotNo:"",cls:"NC",unit:"kg",kg:"",source:""});renderLines();}
  else if(act==="line-del"){slipLines.splice(+t.dataset.i,1);renderLines();}
  else if(act==="slip-dl")guard(function(){return downloadSlip(t.dataset.id,"me");});
  else if(act==="slip-group")guard(function(){return downloadSlip(t.dataset.id,"group");});
  else if(act==="scan-open")scanQR("Quét mã QR trên tem bao nhựa hoặc phiếu xuất",function(x){var m=/px-([0-9a-z]{6})(?![0-9a-z])/i.exec(x);if(m){location.hash="px-"+m[1].toLowerCase();return true;}var c=parseCode(x);if(c){location.hash="tem-"+c;return true;}});
  else if(act==="scan-src")scanQR("Quét mã QR trên bao nguồn",function(x){var c=parseCode(x),sel=$("#xp-src");if(!c||!sel)return;if($('option[value="'+c+'"]',sel)){sel.value=c;updHints();return true;}});
  else if(act==="scan-line")scanQR("Quét mã QR trên tem bao hoặc tem pallet",function(x){var c=parseCode(x),b=c?bags.get(c):null;if(!c)return;if(!b){toast("Mã "+ID(c)+" chưa có trong hệ thống.");return;}if(b.status!=="IN_STOCK"){toast(ID(b.id)+": "+(STATUS[b.status]||"")+", chưa xuất được.");return;}if(lineUsed(b.id)){toast(ID(b.id)+" đã có trong phiếu.");return;}slipLines.push(lineFromBag(b));renderLines();try{tg.HapticFeedback.notificationOccurred("success");}catch(e){}var fi=$("#l"+(slipLines.length-1)+(b.perBag?"-bags":"-kg"));setTimeout(function(){if(fi){fi.scrollIntoView({block:"center"});fi.focus();}},150);toast("Đã thêm "+ID(b.id)+". Nhập số "+(b.perBag?uw1(b)+" hoặc số "+unitOf(b):"lượng")+" xuất.");return true;});
  else if(act==="slip-copy")guard(function(){return copySlip(t.dataset.id);});
  else if(act==="logout"){try{localStorage.removeItem("n2p-web-auth");}catch(e){}cred.pin="";needLogin=true;loginError="";render();}
  else if(act==="iqc-view")guard(showIqcPhotos);
  else if(act==="iqc-lock"){iqcPin="";try{localStorage.removeItem("n2p-iqc-pin");}catch(e){}toast("Đã khóa quyền IQC trên máy này.");render();}
  else if(act==="iqc-clear"){iqcFiles=[];renderIqcThumbs();}
  else if(act==="csv-hist")guard(function(){return exportCsv("hist");});
  else if(act==="void"){
    if(!voidArm){voidArm=true;t.textContent="Bấm lần nữa để hủy tem";return;}
    guard(async function(){await voidBag(curId);voidArm=false;toast("Đã hủy tem.");render();});
  }
});
document.addEventListener("submit",function(e){
  var f=e.target;e.preventDefault();
  if(f.id==="f-unlock"){guard(function(){return unlockIqc(f);});return;}
  if(f.id==="f-login"){var nm=f.name.value.trim(),pn=f.pin.value.trim();if(!nm||!pn){loginError="Nhập đủ họ tên và mã PIN.";render();return;}cred={name:nm,pin:pn};myId=nm;needLogin=false;loginError="";ready=false;render();refresh();return;}
  if(f.id==="f-open"){var c=parseCode(f.code.value);if(!c){$("#scan-status").textContent="Mã bao gồm 6 ký tự chữ và số in dưới mã QR.";return;}location.hash="tem-"+c;return;}
  if(!canWrite){toast("Tài khoản này chỉ được xem.");return;}
  if(f.id==="f-slip")guard(createSlip);
  else if(f.id==="f-zin")guard(function(){return createIncoming(f,"ZIN");});
  else if(f.id==="f-mat")guard(function(){return createIncoming(f,"MAT");});
  else if(f.id==="f-iqc")guard(function(){return submitIqc(f);});
  else if(f.id==="f-xp")guard(function(){return createXP(f);});
  else if(f.id==="f-tr")guard(function(){return createTR(f);});
  else if(f.id==="f-weigh")guard(async function(){var kg=num(f.kg.value);if(!(kg>0)){toast("Nhập số kg cân được.");return;}await weigh(curId,kg);toast("Đã nhập kho "+fmtKg(kg)+".");render();});
  else if(f.id==="f-out")guard(async function(){var b=bags.get(curId),kg=num(f.kg.value);if(!(kg>0)){toast("Nhập số lượng xuất.");return;}if(kg>b.remainKg+0.001){toast("Bao chỉ còn "+fmtKg(b.remainKg,b.unit)+".");return;}await issue(curId,kg,f.dest.value.trim()||"Xuất sản xuất");toast("Đã ghi xuất "+fmtKg(kg,b.unit)+".");render();});
  else if(f.id==="f-loc")guard(async function(){var b=clone(bags.get(curId)),L=readLoc(f),old=locText(b)||"chưa xếp";b.loc=L.list.join(", ");b.locSide=b.loc?L.side:false;var nw=locText(b)||"chưa xếp";if(nw===old){toast("Vị trí không đổi.");return;}b.events.push(ev("MOVE",null,old+" → "+nw));await save(b);toast("Đã lưu vị trí "+nw+".");render();});
  else if(f.id==="f-adjust")guard(async function(){var kg=num(f.kg.value);if(!(kg>=0)){toast("Nhập số kg tồn đúng (0 nếu đã hết).");return;}await adjust(curId,kg,f.note.value.trim());toast("Đã điều chỉnh tồn.");render();});
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="slip-photos"){var fl=Array.prototype.slice.call(t.files||[]);t.value="";guard(function(){return slipPhotos(fl);});}
  else if(t.closest("#slip-lines")){if(t.tagName==="SELECT")lineInput(t);}
  else if(t.dataset.h){}
  else if(t.id==="iqc-photos"){Array.prototype.slice.call(t.files||[]).forEach(function(f){if(/^image\//.test(f.type)&&iqcFiles.length<4)iqcFiles.push(f);});t.value="";renderIqcThumbs();}
  else if(t.id==="zin-photo"||t.id==="mat-photo"){handlePhoto(t.files&&t.files[0]);}
  else if(t.id==="scan-file"||t.id==="src-scan"){
    var file=t.files&&t.files[0];if(!file)return;
    var st=$("#scan-status");if(st)st.textContent="Đang đọc mã QR…";
    decodeQR(file).then(function(txt){
      var c=parseCode(txt);t.value="";
      if(!c){var msg=txt?"Mã QR này không phải tem nhựa của trang này.":"Không đọc được mã QR trong ảnh. Chụp gần và thẳng hơn, hoặc gõ mã bao.";if(st)st.textContent=msg;else toast(msg);return;}
      if(t.id==="scan-file"){location.hash="tem-"+c;}
      else{var s=$("#xp-src");if(s&&$('option[value="'+c+'"]',s)){s.value=c;updHints();toast("Đã chọn bao "+ID(c)+".");}else toast("Bao "+ID(c)+" không dùng làm nguồn xay được (chỉ nhựa zin hoặc nhựa trộn).");}
    }).catch(function(){toast("Không mở được ảnh.");});
  }
  else if(t.id==="zin-today"){var zd=$("#zin-date");if(zd){zd.disabled=t.checked;if(t.checked)zd.value=today();else zd.focus();}}
  else if(t.id==="lang"){lang=t.value==="ko"?"ko":"en";try{localStorage.setItem("n2p-label-lang",lang);}catch(err){}render();}
  else{if(t.name==="rmode"){recvMode=t.value==="each"?"each":t.value==="pallet"?"pallet":"lot";try{localStorage.setItem("n2p-recv-mode",recvMode);}catch(err){}}if(t.form&&(t.form.id==="f-zin"||t.form.id==="f-mat"))updSplit(t.form);updHints();}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="slip-q"){slipQ=t.value;renderSlipList();}
  else if(t.closest("#slip-lines")){if(t.tagName!=="SELECT")lineInput(t);}
  else if(t.dataset.h)headInput(t);
  else if(t.id==="out-bags"){var nb=num(t.value),ok=$("#out-kg");if(ok)ok.value=nb>0?String(r2(nb*num(t.dataset.per))):"";}
  else if(t.closest("#f-zin,#f-mat")){if(t.name==="llist")t.dataset.touched=t.value.trim()?"1":"";updSplit(t.form);}
  else if(t.closest("#f-xp,#f-tr"))updHints();
});
document.addEventListener("paste",function(e){
  var items=(e.clipboardData&&e.clipboardData.files)||[];
  if(view==="xuat-may"){var imgs=Array.prototype.slice.call(items).filter(function(f){return /^image\//.test(f.type);});if(imgs.length){e.preventDefault();guard(function(){return slipPhotos(imgs);});}return;}
  if(view!=="tao-tem"||(mode!=="ZIN"&&mode!=="MAT"))return;
  for(var i=0;i<items.length;i++)if(/^image\//.test(items[i].type)){e.preventDefault();handlePhoto(items[i]);return;}
});
document.addEventListener("dragover",function(e){var d=e.target.closest&&e.target.closest("#drop,#drop2");if(d){e.preventDefault();d.classList.add("over");}});
document.addEventListener("dragleave",function(e){var d=e.target.closest&&e.target.closest("#drop,#drop2");if(d)d.classList.remove("over");});
document.addEventListener("drop",function(e){var d=e.target.closest&&e.target.closest("#drop,#drop2");if(!d)return;e.preventDefault();d.classList.remove("over");var df=Array.prototype.slice.call((e.dataTransfer&&e.dataTransfer.files)||[]);if(d.id==="drop2")guard(function(){return slipPhotos(df);});else handlePhoto(df[0]);});
window.addEventListener("hashchange",route);

/* ---------- start ---------- */
function applyTheme(){try{if(tg&&tg.colorScheme)document.documentElement.setAttribute("data-theme",tg.colorScheme==="dark"?"dark":"light");}catch(e){}}
async function refresh(){
  if(pending>0||needLogin)return;
  var seq=writeSeq;
  try{
    var r=await api("list");
    if(pending>0||seq!==writeSeq)return;
    bags.clear();(r.bags||[]).forEach(function(v){if(v&&v.id)bags.set(v.id,v);});
    slips.clear();(r.slips||[]).forEach(function(v){if(v&&v.id&&Array.isArray(v.lines))slips.set(v.id,v);});
    BOT=r.bot||"";WEBQR=!!r.web;iqcFree=!!r.iqc;myTgId=r.me&&r.me.id?String(r.me.id):null;if(webMode){try{localStorage.setItem("n2p-web-auth",JSON.stringify(cred));}catch(e){}}hasOcr=!!r.hasOcr;hasGroup=!!r.hasGroup;authError="";srvError="";canWrite=true;slow=false;
    var first=!ready;ready=true;renderBanner();onData(first);
  }catch(e){
    if(webMode&&e&&(e.code==="bad_pin"||e.code==="no_web"||e.code==="locked")){needLogin=true;loginError=errMsg(e,"");cred.pin="";try{localStorage.removeItem("n2p-web-auth");}catch(x){}ready=true;render();return;}
    if(e&&e.code&&e.code!=="server"){authError=errMsg(e,"Không dùng được app.");canWrite=false;}else{slow=true;srvError=e&&e.code==="server"?String(e.message||""):"";}
    var f2=!ready;ready=true;if(f2)render();else renderBanner();
  }
}
async function start(){
  tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
  var sp="";
  if(tg){
    try{tg.ready();tg.expand();}catch(e){}
    INIT=tg.initData||"";
    var u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u)myId=[u.first_name,u.last_name].filter(Boolean).join(" ")||u.username||String(u.id);
    sp=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";
    applyTheme();try{tg.onEvent("themeChanged",applyTheme);}catch(e){}
  }
  if(!sp){try{sp=new URLSearchParams(location.search).get("tgWebAppStartParam")||"";}catch(e){}}
  route();
  if(!/^https?:\/\//.test(API_URL)){notConfigured=true;ready=true;memMode=true;render();return;}
  if(!INIT){
    webMode=true;
    try{var sv2=JSON.parse(localStorage.getItem("n2p-web-auth")||"null");if(sv2&&sv2.name&&sv2.pin)cred={name:String(sv2.name),pin:String(sv2.pin)};}catch(e){}
    if(!cred.pin){needLogin=true;render();}else myId=cred.name;
  }
  if(!needLogin)await refresh();
  if(/^(tem|px)-[0-9a-z]{6}$/i.test(sp))location.hash=sp.toLowerCase();
  setInterval(function(){if(!document.hidden)refresh();},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh();});
}
start();
})();
</script>
